name: erp_financial_pipeline
version: "0.1.0"
config-version: 2

# Must match the profile name in profiles.yml exactly.
profile: erp_financial_pipeline

# Folder locations — all relative to this file.
model-paths:    ["models"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

# dbt writes compiled SQL and run artefacts here.
# Already in .gitignore — never commit this folder.
target-path: "target"
clean-targets: ["target", "dbt_packages"]

#Env vars
vars:
  erp_silver_dir: "data/silver"
  erp_gold_dir: "data/gold"


models:
  erp_financial_pipeline:

    staging:
      # Every model in models/staging/ is materialised as a view.
      # The + prefix means "apply to all models in this folder".
      +materialized: view
      # Creates a separate DuckDB schema called "staging".
      # Full reference: staging.stg_revenues, staging.stg_outlays, etc.
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      # Mart models are physically stored tables — fast for analysts to query.
      +materialized: table
      +schema: marts